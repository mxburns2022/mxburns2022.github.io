# Site Configuration
title: "Matthew X. Burns"
author: "Matthew X. Burns"
description: "Researcher in optimization, novel computing devices, and high-performance computing."
url: "https://mxburns2022.github.io"
baseurl: ""
repository: "mxburns2022/mxburns2022.github.io"

# Build settings
markdown: kramdown
theme: null
permalink: /blog/:year/:month/:day/:title/

# Collections
collections:
  publications:
    output: true
    permalink: /:collection/:path/
  blog:
    output: true
    permalink: /blog/:path/
  projects:
    output: true
    permalink: /projects/:path/
  preprints:
    output: true
    permalink: /preprints/:path/

# Social profiles
github_username: mxburns2022
google_scholar: "tsahsHUAAAAJ&hl=en"
linkedin_username: ""
twitter_username: ""

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Matthew X. Burns"
  - scope:
      path: ""
      type: "publications"
    values:
      layout: "publication"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
      type: "preprints"
    values:
      layout: "publication"

# Exclude
exclude:
  - Gemfile
  - Gemfile.lock
  - .gitignore
  - README.md
  - node_modules/
  - vendor/
