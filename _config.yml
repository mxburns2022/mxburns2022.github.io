# Site Configuration
title: "Your Name"
author: "Your Name"
email: "your.email@example.com"
description: "A research-focused website showcasing publications, blog posts, and code projects."
url: "https://mxburns2022.github.io"
baseurl: ""
repository: "mxburns2022/mxburns2022.github.io"

# Build settings
markdown: kramdown
theme: null
permalink: /blog/:year/:month/:day/:title/

# Collections
collections:
  publications:
    output: true
    permalink: /:collection/:path/
  blog:
    output: true
    permalink: /blog/:path/
  projects:
    output: true
    permalink: /projects/:path/

# Social profiles
github_username: mxburns2022
google_scholar: "tsahsHUAAAAJ&hl=en"
linkedin_username: mxburns
twitter_username: ""

# Pagination
paginate: 10
paginate_path: "/blog/page:num/"

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-feed

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Your Name"
  - scope:
      path: ""
      type: "publications"
    values:
      layout: "publication"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"

# Exclude
exclude:
  - Gemfile
  - Gemfile.lock
  - .gitignore
  - README.md
  - node_modules/
  - vendor/
